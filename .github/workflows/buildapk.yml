name: Build and Release Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    # 1. 自动生成或补全 gradlew 脚本，防止找不到文件报错
    - name: Generate Gradle Wrapper
      run: |
        if [ ! -f "gradlew" ]; then
          gradle wrapper
        fi
        chmod +x gradlew

    # 2. 恢复或生成固定的签名密钥
    - name: Restore KeyStore from Cache
      id: keystore-cache
      uses: actions/cache@v4
      with:
        path: ~/.android/adbhelper-release.jks
        key: adbhelper-fixed-keystore-v1

    - name: Generate KeyStore if not exists
      if: steps.keystore-cache.outputs.cache-hit != 'true'
      run: |
        mkdir -p ~/.android
        keytool -genkeypair -v \
          -keystore "$HOME/.android/adbhelper-release.jks" \
          -alias adbhelper \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -storepass adbhelper123 \
          -keypass adbhelper123 \
          -dname "CN=ADB Helper, OU=Dev, O=ADB Helper, L=Hangzhou, ST=Zhejiang, C=CN"

    # 3. 编译 Release APK
    - name: Build Release APK
      run: ./gradlew assembleRelease

    # 4. 使用 Android 原生 apksigner 工具进行签名
    - name: Sign APK with apksigner
      run: |
        APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
        echo "Found APK: $APK_PATH"
        
        BUILD_TOOLS_VERSION=$(ls $ANDROID_SDK_ROOT/build-tools | sort -V | tail -n 1)
        APKSIGNER="$ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS_VERSION/apksigner"
        
        if [ ! -f "$APKSIGNER" ]; then
          APKSIGNER=$(find /usr/local/lib/android/sdk/build-tools -name "apksigner" | tail -n 1)
        fi
        
        echo "Using apksigner: $APKSIGNER"
        
        $APKSIGNER sign \
          --ks "$HOME/.android/adbhelper-release.jks" \
          --ks-key-alias adbhelper \
          --ks-pass pass:adbhelper123 \
          --key-pass pass:adbhelper123 \
          "$APK_PATH"
          
        SIGNED_APK="${APK_PATH//.apk/-signed.apk}"
        mv "$APK_PATH" "$SIGNED_APK"
        echo "Signed APK successfully: $SIGNED_APK"

    # 5. 自动提取 versionName 并发布 Release
    - name: Extract Version and Release
      run: |
        VERSION_NAME=$(grep "versionName" app/build.gradle.kts | head -n 1 | sed -E 's/.*versionName[[:space:]]*=[[:space:]]*["\x27]([^"\x27]+)["\x27].*/\1/')
        
        if [ -z "$VERSION_NAME" ] || [ "$VERSION_NAME" = "app/build.gradle.kts" ]; then
          VERSION_NAME="1.1.${{ github.run_number }}"
        fi
        
        echo "Extracted App Version: $VERSION_NAME"
        echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV

    - name: Publish GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: app/build/outputs/apk/release/*-signed.apk
        tag_name: v${{ env.VERSION_NAME }}
        name: ADB-Helper v${{ env.VERSION_NAME }}
        body: |
          ### 🚀 自动构建版本 v${{ env.VERSION_NAME }}
          - 使用原生 apksigner 签名
          - 已启用云端密钥缓存，支持无缝覆盖升级
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
