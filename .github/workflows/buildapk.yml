name: Build and Release Android APK

on:
  push:
    branches: [ "main" ]
    paths:
      - 'app/**'          # 只有 app 目录下的文件变动才触发
      - 'gradle/**'       # Gradle 目录变动触发
      - 'build.gradle.kts' # 根目录构建脚本变动触发
      - 'settings.gradle.kts'
      - '!**.md'          # 排除 Markdown 文件变动触发
      - '!.github/workflows/**' # 排除 CI 配置文件自身修改触发（防止套娃）
  workflow_dispatch:      # 允许在网页上随时手动触发（不受 paths 限制）

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Generate Gradle Wrapper
      run: |
        if [ ! -f "gradlew" ]; then
          gradle wrapper
        fi
        chmod +x gradlew

    # 1. 从 GitHub Secrets 还原签名密钥（安全且不会因 7 天未访问而丢失）
    - name: Restore KeyStore from Secrets
      run: |
        mkdir -p ~/.android
        KEYSTORE_PATH="$HOME/.android/adbhelper-release.jks"
        
        # 将 Secret 中的 Base64 字符串解码还原为 .jks 文件
        echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > "$KEYSTORE_PATH"
        
        # 复制到项目根目录（供 Gradle 编译使用）
        cp "$KEYSTORE_PATH" ./my-upload-key.jks
        echo "Successfully restored and placed my-upload-key.jks."

    # 2. 编译 Release APK，传入对应的环境变量
    - name: Build Release APK
      run: ./gradlew assembleRelease
      env:
        STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    # 3. 自动提取 versionName、生成更新日志 (Changelog) 并发布 Release
    - name: Extract Version and Generate Changelog
      run: |
        # 提取版本号
        VERSION_NAME=$(grep "versionName" app/build.gradle.kts | head -n 1 | sed -E 's/.*versionName[[:space:]]*=[[:space:]]*["\x27]([^"\x27]+)["\x27].*/\1/')
        
        if [ -z "$VERSION_NAME" ] || [ "$VERSION_NAME" = "app/build.gradle.kts" ]; then
          VERSION_NAME="1.1.${{ github.run_number }}"
        fi
        
        echo "Extracted App Version: $VERSION_NAME"
        echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV

        # 获取上一个 Tag，生成自动化更新日志
        PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
        
        if [ -n "$PREV_TAG" ]; then
          CHANGELOG=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s" --no-merges)
        else
          CHANGELOG=$(git log -n 10 --pretty=format:"- %s" --no-merges)
        fi

        if [ -z "$CHANGELOG" ]; then
          CHANGELOG="- 持续集成构建与常规更新。"
        fi

        # 多行文本写入 GITHUB_ENV 的标准写法
        delimiter="EOF_CHANGELOG"
        echo "CHANGELOG<<$delimiter" >> $GITHUB_ENV
        echo "$CHANGELOG" >> $GITHUB_ENV
        echo "$delimiter" >> $GITHUB_ENV

    # 4. 发布到 GitHub Releases
    - name: Publish GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: app/build/outputs/apk/release/*.apk
        tag_name: v${{ env.VERSION_NAME }}
        name: ADB-Helper v${{ env.VERSION_NAME }}
        body: |
          ### 🚀 自动构建版本 v${{ env.VERSION_NAME }}

          #### 📝 更新日志 (Changelog):
          ${{ env.CHANGELOG }}
          
          ---
          *由 GitHub Actions 自动打包发布*
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
