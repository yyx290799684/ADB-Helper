name: Build and Release Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    # 1. 自动生成或补全 gradlew 脚本
    - name: Generate Gradle Wrapper
      run: |
        if [ ! -f "gradlew" ]; then
          gradle wrapper
        fi
        chmod +x gradlew

    # 2. 恢复或生成固定的签名密钥，并将其复制到项目根目录下的 my-upload-key.jks
    - name: Restore KeyStore from Cache
      id: keystore-cache
      uses: actions/cache@v4
      with:
        path: ~/.android/adbhelper-release.jks
        key: adbhelper-fixed-keystore-v1

    - name: Prepare Signing Key
      run: |
        mkdir -p ~/.android
        KEYSTORE_PATH="$HOME/.android/adbhelper-release.jks"
        
        # 如果缓存没有，则生成一个新的
        if [ ! -f "$KEYSTORE_PATH" ]; then
          echo "Generating new persistent release keystore..."
          keytool -genkeypair -v \
            -keystore "$KEYSTORE_PATH" \
            -alias adbhelper \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass adbhelper123 \
            -keypass adbhelper123 \
            -dname "CN=ADB Helper, OU=Dev, O=ADB Helper, L=Hangzhou, ST=Zhejiang, C=CN"
        fi
        
        # 复制到项目根目录，供 Gradle 的 build.gradle.kts 直接读取
        cp "$KEYSTORE_PATH" ./my-upload-key.jks
        echo "Successfully placed my-upload-key.jks in root directory."

    # 3. 直接编译 Release APK（Gradle 会自动使用根目录的 my-upload-key.jks 签名）
    - name: Build Release APK
      run: ./gradlew assembleRelease

    # 4. 自动提取 versionName 并发布 Release
    - name: Extract Version and Release
      run: |
        VERSION_NAME=$(grep "versionName" app/build.gradle.kts | head -n 1 | sed -E 's/.*versionName[[:space:]]*=[[:space:]]*["\x27]([^"\x27]+)["\x27].*/\1/')
        
        if [ -z "$VERSION_NAME" ] || [ "$VERSION_NAME" = "app/build.gradle.kts" ]; then
          VERSION_NAME="1.1.${{ github.run_number }}"
        fi
        
        echo "Extracted App Version: $VERSION_NAME"
        echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV

    - name: Publish GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: app/build/outputs/apk/release/*.apk
        tag_name: v${{ env.VERSION_NAME }}
        name: ADB-Helper v${{ env.VERSION_NAME }}
        body: |
          ### 🚀 自动构建版本 v${{ env.VERSION_NAME }}
          - 完美适配项目自带签名配置
          - 已启用云端密钥缓存，支持无缝覆盖升级
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
