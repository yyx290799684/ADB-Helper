name: Build and Release Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 1. 恢复或生成固定的签名密钥（保证每次签名一致，支持无缝覆盖升级）
    - name: Restore KeyStore from Cache
      id: keystore-cache
      uses: actions/cache@v4
      with:
        path: ~/.android/adbhelper-release.jks
        key: adbhelper-fixed-keystore-v1

    - name: Generate KeyStore if not exists
      if: steps.keystore-cache.outputs.cache-hit != 'true'
      run: |
        mkdir -p ~/.android
        keytool -genkeypair -v \
          -keystore "$HOME/.android/adbhelper-release.jks" \
          -alias adbhelper \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -storepass adbhelper123 \
          -keypass adbhelper123 \
          -dname "CN=ADB Helper, OU=Dev, O=ADB Helper, L=Hangzhou, ST=Zhejiang, C=CN"

    # 2. 编译 Release APK
    - name: Build Release APK
      run: ./gradlew assembleRelease

    # 3. 使用固定密钥签名 APK
    - name: Sign APK
      uses: rstyle/sign-android-release@v1
      with:
        releaseDirectory: app/build/outputs/apk/release
        keystorePath: /home/runner/.android/adbhelper-release.jks
        alias: adbhelper
        keyStorePassword: adbhelper123
        keyPassword: adbhelper123

    # 4. 自动提取 app/build.gradle.kts 中的 versionName 并发布 Release
    - name: Extract Version and Release
      run: |
        VERSION_NAME=$(grep "versionName" app/build.gradle.kts | head -n 1 | sed -E 's/.*versionName[[:space:]]*=[[:space:]]*["\x27]([^"\x27]+)["\x27].*/\1/')
        
        if [ -z "$VERSION_NAME" ] || [ "$VERSION_NAME" = "app/build.gradle.kts" ]; then
          VERSION_NAME="1.1.${{ github.run_number }}"
        fi
        
        echo "Extracted App Version: $VERSION_NAME"
        echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV

    - name: Publish GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: app/build/outputs/apk/release/*-signed.apk
        tag_name: v${{ env.VERSION_NAME }}
        name: ADB-Helper v${{ env.VERSION_NAME }}
        body: |
          ### 🚀 自动构建版本 v${{ env.VERSION_NAME }}
          - 对应源码版本构建
          - 已启用云端密钥缓存，支持无缝覆盖升级
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
